name: Extension checks

on:
  pull_request:
  push:
    branches: [master, redevelopment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:source
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run build:all
      - run: npm run check:build
      - run: npm run lint:firefox
      - run: npm run package:built
      - run: npm run check:packages
      - run: npm run check:reproducibility
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-preview-packages
          path: dist/
          include-hidden-files: false
          retention-days: 14
          if-no-files-found: error
