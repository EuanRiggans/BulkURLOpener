name: Browser integration

on:
  pull_request:
  push:
    branches: [master, redevelopment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            label: chrome-stable
          - browser: firefox
            label: firefox-stable
            version: latest
          - browser: firefox
            label: firefox-esr
            version: latest-esr
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - if: matrix.browser == 'chrome'
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: stable
          install-dependencies: true
          install-chromedriver: true
      - if: matrix.browser == 'chrome'
        name: Configure the matching Chrome sandbox helper
        env:
          BUO_BROWSER_BIN: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          buo_browser_dir="$(dirname "$BUO_BROWSER_BIN")"
          buo_sandbox="$buo_browser_dir/chrome_sandbox"
          test -f "$buo_sandbox"
          sudo chown root:root "$buo_sandbox"
          sudo chmod 4755 "$buo_sandbox"
          printf 'CHROME_DEVEL_SANDBOX=%s\n' "$buo_sandbox" >> "$GITHUB_ENV"
      - if: matrix.browser == 'firefox'
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        with:
          firefox-version: ${{ matrix.version }}
      - if: matrix.browser == 'firefox'
        name: Install verified GeckoDriver
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/geckodriver.tar.gz" https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          echo "e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e  $RUNNER_TEMP/geckodriver.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP"
      - name: Exercise extension in a fresh browser profile
        run: npm run test:browser
        env:
          BUO_TEST_BROWSER: ${{ matrix.browser }}
          BUO_TEST_LABEL: ${{ matrix.label }}
          BUO_BROWSER_BIN: ${{ steps.chrome.outputs.chrome-path || steps.firefox.outputs.firefox-path }}
          BUO_DRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path || format('{0}/geckodriver', runner.temp) }}
          MOZ_REMOTE_ALLOW_SYSTEM_ACCESS: '1'
      - name: Exercise same-identity development upgrade
        run: npm run test:upgrade
        env:
          BUO_TEST_BROWSER: ${{ matrix.browser }}
          BUO_TEST_LABEL: ${{ matrix.label }}
          BUO_BROWSER_BIN: ${{ steps.chrome.outputs.chrome-path || steps.firefox.outputs.firefox-path }}
          BUO_DRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path || format('{0}/geckodriver', runner.temp) }}
          MOZ_REMOTE_ALLOW_SYSTEM_ACCESS: '1'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ matrix.label }}
          path: test-results/${{ matrix.label }}/
          retention-days: 14
          if-no-files-found: warn
